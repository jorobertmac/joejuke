<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Joe's Juke — CC1-style Puzzle + Editor</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="js/constants.js"></script>
  <script defer src="js/levels.js"></script>
  <script defer src="js/tiles.js"></script>
  <script defer src="js/movement.js"></script>
  <script defer src="js/drawing.js"></script>
  <script defer src="js/editor.js"></script>
  <script defer src="game.js"></script>
  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        if (!window.__JOEJUKE_READY__) {
          var el = document.getElementById("loadError");
          if (el) {
            el.classList.remove("hidden");
            el.textContent = "Game script failed to load. Check that js/ and game.js are next to index.html.";
          }
        }
      }, 800);
    });
  </script>
</head>
<body>
  <div id="game-wrapper">
    <header>
      <h1>Joe's Juke</h1>
      <p class="tagline">Dodge • Collect • Escape • Create</p>
    </header>
    <div id="hud">
      <span class="hud-level">Lv <strong id="levelNum">1</strong>/<span id="levelTotal">30</span></span>
      <span class="hud-chips">Chips <strong id="chipCount">0</strong>/<span id="chipsNeededDisplay">0</span></span>
      <span id="invDisplay" class="hud-inv" title="Keys & boots"></span>
      <span id="status">Swipe or use D-pad</span>
    </div>
    <div id="canvas-wrap">
      <canvas id="canvas" width="640" height="480"></canvas>
      <div id="overlay">
        <div id="startScreen" class="screen">
          <h2>Joe's Juke</h2>
          <p>Collect all chips, dodge monsters, reach the exit.</p>
          <p class="hint">Swipe or use the D-pad. Keys & boots help.</p>
          <button id="startBtn" type="button">Play</button>
          <button id="editorBtn" type="button" class="secondary">Level Editor</button>
          <p id="loadError" class="hidden error"></p>
        </div>
        <div id="levelComplete" class="screen hidden">
          <h2>Level Clear!</h2>
          <button id="nextBtn" type="button">Next Level</button>
          <button id="retryBtn" type="button" class="secondary">Retry</button>
          <button id="backToEditorBtn" type="button" class="secondary hidden">Back to Editor</button>
        </div>
        <div id="gameOver" class="screen hidden">
          <h2>Ouch!</h2>
          <p id="deathMsg">You died.</p>
          <button id="retryBtn2" type="button">Retry</button>
          <button id="restartBtn" type="button" class="secondary">Title</button>
        </div>
        <div id="winScreen" class="screen hidden">
          <h2>You Win!</h2>
          <p>All levels cleared.</p>
          <button id="restartBtn2" type="button">Title</button>
          <button id="backToEditorWinBtn" type="button" class="secondary hidden">Back to Editor</button>
        </div>
        <div id="exportModal" class="screen hidden modal">
          <h2>Export Level</h2>
          <textarea id="exportText" readonly rows="12"></textarea>
          <button id="closeExportBtn" type="button">Close</button>
        </div>
        <div id="importModal" class="screen hidden modal">
          <h2>Import Level</h2>
          <textarea id="importText" rows="12" placeholder="Paste JSON or map text"></textarea>
          <button id="confirmImportBtn" type="button">Import</button>
          <button id="closeImportBtn" type="button" class="secondary">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Editor toolbar sits below the canvas so the map stays fully tappable -->
    <div id="editorBar" class="hidden">
      <div class="editor-size">
        <label>W <input type="number" id="editCols" min="5" max="100" value="32" inputmode="numeric"></label>
        <label>H <input type="number" id="editRows" min="5" max="100" value="32" inputmode="numeric"></label>
        <button id="resizeBtn" type="button" class="small">Apply</button>
      </div>
      <div id="palette" class="palette"></div>
      <div class="editor-actions">
        <button id="testLevelBtn" type="button">Test</button>
        <button id="exportBtn" type="button" class="secondary">Export</button>
        <button id="importBtn" type="button" class="secondary">Import</button>
        <button id="clearMapBtn" type="button" class="secondary">Clear</button>
        <button id="exitEditorBtn" type="button" class="secondary">Exit</button>
      </div>
    </div>

    <div id="dpad" aria-label="Movement controls">
      <button type="button" class="dpad-btn" data-dx="0" data-dy="-1" id="btnUp" aria-label="Up">▲</button>
      <div class="dpad-mid">
        <button type="button" class="dpad-btn" data-dx="-1" data-dy="0" id="btnLeft" aria-label="Left">◀</button>
        <button type="button" class="dpad-btn" data-dx="1" data-dy="0" id="btnRight" aria-label="Right">▶</button>
      </div>
      <button type="button" class="dpad-btn" data-dx="0" data-dy="1" id="btnDown" aria-label="Down">▼</button>
    </div>
  </div>
</body>
</html>
